[package]
name = "wslawake"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
tokio = { version = "1.54.1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1.54.1", features = [
    "process",
] }
zbus = { version = "6.2.0", features = ["tokio"] }
